[project]
name = "mon-projet-git"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maimouna Camara", email = "maimouna.camara-2@etu.univ-tours.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "pyfiglet>=1.0.4",
    "rich>=15.0.0",
    "rich-pyfiglet>=2.0.1",
]

[project.scripts]
mon-projet-git = "mon_projet_git:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "mon_projet_git",
]
